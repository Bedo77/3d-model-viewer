<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics Educational 3D Models</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
            background-color: #f46c27;
            display: flex;
        }
        .main-content {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        .model-viewport {
            width: 100%;
            height: 100%;
            background-color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="main-content">
        <div class="model-viewport" id="mainViewport"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script>
        let currentScene, currentRenderer, currentCamera, currentControls, modelGroup;

        function createScene(viewportId) {
            const viewport = document.getElementById(viewportId);
            currentScene = new THREE.Scene();
            currentCamera = new THREE.PerspectiveCamera(75, viewport.clientWidth / viewport.clientHeight, 0.1, 1000);
            currentRenderer = new THREE.WebGLRenderer({ antialias: true });

            currentRenderer.setSize(viewport.clientWidth, viewport.clientHeight);
            viewport.innerHTML = ''; // Clear previous content
            viewport.appendChild(currentRenderer.domElement);

            currentControls = new THREE.OrbitControls(currentCamera, currentRenderer.domElement);
            currentControls.enableDamping = true;
            currentControls.dampingFactor = 0.1;

            // Add ambient light
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            currentScene.add(ambientLight);

            // Position the camera
            currentCamera.position.set(0, 5, 10);
            currentCamera.lookAt(0, 0, 0);

            createModelGroup();
            animate();
        }

        function createModelGroup() {
            modelGroup = new THREE.Group();
            currentScene.add(modelGroup);
        }

        function animate() {
            requestAnimationFrame(animate);
            if (currentScene && modelGroup) {
                modelGroup.rotation.y += 0.005;
                currentRenderer.render(currentScene, currentCamera);
            }
        }

        function clearModels() {
            while (modelGroup && modelGroup.children.length > 0) {
                modelGroup.remove(modelGroup.children[0]);
            }
        }

        function loadModels(models) {
            console.log('Starting to load models...');
            createScene('mainViewport');
            clearModels();

            let loadedCount = 0;
            const totalModels = models.length;
            const radius = 5; // Reduced radius for closer placement
            const angleIncrement = (Math.PI * 2) / totalModels;

            models.forEach((model, index) => {
                const loader = new THREE.GLTFLoader();
                loader.load(
                    model.path,
                    function (object) {
                        loadedCount++;
                        console.log(`Successfully loaded: ${model.name}`);

                        // Position the model in a circular arrangement
                        const angle = angleIncrement * index;
                        const x = Math.cos(angle) * radius;
                        const z = Math.sin(angle) * radius;

                        object.scene.position.set(x, 0, z);
                        object.scene.scale.set(model.scale.x, model.scale.y, model.scale.z);
                        modelGroup.add(object.scene);

                        // Add a spotlight directed at the model
                        const spotlight = new THREE.SpotLight(0xffffff, 1, 100, Math.PI / 4, 0.5);
                        spotlight.position.set(x, 5, z); // Position the spotlight above the model
                        spotlight.target = object.scene; // Direct the spotlight at the model
                        currentScene.add(spotlight);
                        currentScene.add(spotlight.target);

                        if (loadedCount === totalModels) {
                            console.log('All models loaded successfully');
                        }
                    },
                    function (xhr) {
                        console.log(`${model.name}: ${(xhr.loaded / xhr.total * 100).toFixed(2)}% loaded`);
                    },
                    function (error) {
                        console.error(`Error loading model: ${model.path}`, error);
                        loadedCount++;
                        if (loadedCount === totalModels) {
                            console.log('All models processed (some may have failed).');
                        }
                    }
                );
            });
        }

        const allModels = [
            { path: 'https://raw.githubusercontent.com/Bedo77/3d-model-viewer/main/Physics/grade_one-arcade_machine.glb', name: 'Grade 1 Arcade Machine', scale: { x: 1, y: 1, z: 1 } },
            { path: 'https://raw.githubusercontent.com/Bedo77/3d-model-viewer/main/Physics/grade_one-time_machine.glb', name: 'Grade 1 Time Machine', scale: { x: 1, y: 1, z: 1 } },
            { path: 'https://raw.githubusercontent.com/Bedo77/3d-model-viewer/main/Physics/grade_two-forces_on_a_rotating_man.glb', name: 'Grade 2 Forces on a Rotating Man', scale: { x: 1, y: 1, z: 1 } },
            { path: 'https://raw.githubusercontent.com/Bedo77/3d-model-viewer/main/Physics/grade_two-machinery_-_single_pashe_dc_motor.glb', name: 'Grade 2 Single Phase DC Motor', scale: { x: 1, y: 1, z: 1 } },
            { path: 'https://raw.githubusercontent.com/Bedo77/3d-model-viewer/main/Physics/grade_three-electromagneticwave.glb', name: 'Grade 3 Electromagnetic Wave', scale: { x: 1, y: 1, z: 1 } },
            { path: 'https://raw.githubusercontent.com/Bedo77/3d-model-viewer/main/Physics/grade_three-electromagnetic_portal.glb', name: 'Grade 3 Electromagnetic Portal', scale: { x: 1, y: 1, z: 1 } }
        ];

        // Load all models when the page loads
        loadModels(allModels);
    </script>
</body>
</html>
