<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 1: Simple Machines</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            height: 100vh;
            background-color: #f46c27; /* flamingo */
            display: flex;
        }
        .sidebar {
            width: 20%; /* Sidebar width */
            height: 100%; /* Full height */
            background-color: #2c7481; /* Paradiso */
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding: 10px;
        }
        .button {
            width: 100%;
            height: 70px;
            margin: 10px 0;
            border-radius: 5px;
            background-color: #f47e42; /* Jaffa */
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.3s ease, background-color 0.3s ease;
        }
        .button:hover {
            background-color: #f46c27; /* Flamingo */
            transform: scale(1.05);
        }
        .main-content {
            width: 60%; /* Remaining width */
            height: 100%; /* Full height */
            display: flex;
            flex-direction: column;
        }
        .info-viewport {
            width: 100%; /* Full width of main-content */
            height: 50%; /* Half of main-content height */
            background-color: #1A0E0D; /* Darker brown */
            color: #FFFFFF; /* Regular white color */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
            box-sizing: border-box;
            overflow-y: auto;
        }
        .model-viewport {
            width: 100%; /* Full width of main-content */
            height: 50%; /* Half of main-content height */
            background-color: #ffffff; /* White background */
            margin-bottom: 2.5mm; /* Small bottom margin */
            border-radius: 5px; 
            position: relative;
        }
        .models-tracks {
            width: 20%; /* Right sidebar width */
            height: 100%; /* Full height */
            background-color: #2c7481; /* Paradiso */
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding: 10px;
        }
        .model-icon {
            width: 80px;
            height: 80px;
            margin: 10px;
            border: 1px solid #fff;
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            background-color: #fff;
            transition: transform 0.3s ease;
        }
        .model-icon:hover {
            transform: scale(1.1);
        }
        .model-icon img {
            max-width: 100%;
            max-height: 100%;
            border-radius: 5px;
        }
        .top-bar {
            width: 100%;
            height: 50px;
            background-color: #2c7481; /* Paradiso */
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 0 20px;
            box-sizing: border-box;
        }
        .home-back-button {
            margin-left: 10px;
            padding: 10px 15px;
            color: white;
            background-color: #f47e42; /* Jaffa */
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .home-back-button:hover {
            background-color: #f46c27; /* Flamingo */
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="button" onclick="location.href='grade1.html'">Grade 1</div>
        <div class="button" onclick="location.href='grade2.html'">Grade 2</div>
        <div class="button" onclick="location.href='grade3.html'">Grade 3</div>
    </div>
    <div class="main-content">
        <div class="info-viewport">
            <h2>Grade 1: Simple Machines</h2>
            <p>Exploration of how simple machines work and how they make work easier.</p>
        </div>
        <div class="model-viewport" id="mainViewport">
            <h3>Models for Grade 1:</h3>
            <div class="model-icon"><img src="arcade_machine.png" alt="Arcade Machine" /></div>
            <div class="model-icon"><img src="time_machine.png" alt="Time Machine" /></div>
        </div>
    </div>
    <div class="models-tracks">
        <h3 style="color: white;">Model Tracks</h3>
        <div class="model-icon"><img src="arcade_machine.png" alt="Arcade Machine" /></div>
        <div class="model-icon"><img src="time_machine.png" alt="Time Machine" /></div>
    </div>
    <div class="top-bar">
        <button class="home-back-button" onclick="location.href='index.html'">Home</button>
        <button class="home-back-button" onclick="history.back()">Back</button>
    </div>
</body>
</html>
