<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row => row.some(filledCell));

                // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                // Fallback
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }
        </script><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 1 Science - Smartistic-Lab</title>
    <link rel="stylesheet" href="grade_one.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-buttons">
            <div class="button" onclick="window.location.href='../science.html'">Back to Science</div>
        </div>
        <div class="bottom-buttons">
            <div class="button" onclick="showContentHub()">Content Hub</div>
        </div>
    </div>
    <div class="tab-container">
        <div class="tabs">
            <div class="tab active" onclick="switchTab('tab1')">Lesson Plan</div>
            <div class="tab" onclick="switchTab('tab2')">Present</div>
            <div class="tab" onclick="switchTab('tab3')">Explore</div>
        </div>
        <div class="tab-content active" id="tab1Content">
            <iframe id="tab1Iframe" src="lessonPlan.html"></iframe>
        </div>
        <div class="tab-content" id="tab2Content">
            <iframe id="tab2Iframe" src="present.html"></iframe>
        </div>
        <div class="tab-content" id="tab3Content">
            <iframe id="tab3Iframe" src="explore.html"></iframe>
        </div>
    </div>
    <div id="lessonsHubModal" style="display: none;">
        <div class="modal-header">
            <h2>Content Hub</h2>
            <button class="modal-close" onclick="document.getElementById('lessonsHubModal').style.display='none'">X</button>
        </div>
        <div class="modal-content">
            <input type="text" class="search-bar" placeholder="Search lessons..." aria-label="Search lessons">
            <div id="contentHubContent"></div>
        </div>
    </div>

    <script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
            return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
            if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
                try {
                    var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                    var firstSheetName = workbook.SheetNames[0];
                    var worksheet = workbook.Sheets[firstSheetName];

                    var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                    var filteredData = jsonData.filter(row => row.some(filledCell));

                    var headerRowIndex = filteredData.findIndex((row, index) =>
                        row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                    );
                    if (headerRowIndex === -1 || headerRowIndex > 25) {
                        headerRowIndex = 0;
                    }

                    var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex));
                    csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                    return csv;
                } catch (e) {
                    console.error(e);
                    return "";
                }
            }
            return gk_fileData[filename] || "";
        }
    </script>

    <script>
        const gradeOneContent = { lessons: [] };

        function switchTab(tabId) {
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            document.querySelector(`[onclick="switchTab('${tabId}')"]`).classList.add('active');
            document.getElementById(`${tabId}Content`).classList.add('active');
        }

        function showContentHub() {
            const modal = document.getElementById('lessonsHubModal');
            const content = document.getElementById('contentHubContent');
            const searchBar = modal.querySelector('.search-bar');

            content.innerHTML = gradeOneContent.lessons.length > 0
                ? gradeOneContent.lessons.map(lesson => `
                    <div class="lesson-card" data-lesson='${JSON.stringify(lesson)}' role="button" aria-label="Select lesson: ${lesson.name}" tabindex="0">
                        <h3>${lesson.name}</h3>
                        <p><strong>Subject:</strong> ${lesson.subject || 'Science'}</p>
                        <p><strong>Teacher:</strong> ${lesson.teacher || 'Unknown'}</p>
                        <p><strong>Objective:</strong> ${lesson.objective ? lesson.objective.substring(0, 50) + (lesson.objective.length > 50 ? '...' : '') : 'No objective'}</p>
                    </div>
                `).join('')
                : '<p class="no-lessons">No Lessons Available</p>';

            content.querySelectorAll('.lesson-card').forEach(card => {
                const handler = () => {
                    const lesson = JSON.parse(card.getAttribute('data-lesson'));
                    switchTab('tab1');
                    document.getElementById('tab1Iframe').contentWindow.postMessage({
                        type: 'lessonSelected',
                        lesson: lesson
                    }, '*');
                };
                card.addEventListener('click', handler);
                card.addEventListener('keypress', e => {
                    if (e.key === 'Enter') handler();
                });
            });

            searchBar.addEventListener('input', () => {
                const query = searchBar.value.toLowerCase();
                content.innerHTML = gradeOneContent.lessons
                    .filter(lesson => lesson.name.toLowerCase().includes(query) || (lesson.subject || '').toLowerCase().includes(query))
                    .map(lesson => `
                        <div class="lesson-card" data-lesson='${JSON.stringify(lesson)}' role="button" aria-label="Select lesson: ${lesson.name}" tabindex="0">
                            <h3>${lesson.name}</h3>
                            <p><strong>Subject:</strong> ${lesson.subject || 'Science'}</p>
                            <p><strong>Teacher:</strong> ${lesson.teacher || 'Unknown'}</p>
                            <p><strong>Objective:</strong> ${lesson.objective ? lesson.objective.substring(0, 50) + (lesson.objective.length > 50 ? '...' : '') : 'No objective'}</p>
                    </div>
                `).join('') || '<p class="no-lessons">No Lessons Available</p>';

                content.querySelectorAll('.lesson-card').forEach(card => {
                    const handler = () => {
                        const lesson = JSON.parse(card.getAttribute('data-lesson'));
                        switchTab('tab1');
                        document.getElementById('tab1Iframe').contentWindow.postMessage({
                            type: 'lessonSelected',
                            lesson: lesson
                        }, '*');
                    };
                    card.addEventListener('click', handler);
                    card.addEventListener('keypress', e => {
                        if (e.key === 'Enter') handler();
                    });
                });
            });

            modal.style.display = 'block';
        }

        function sendLessonToExplore(lessonData) {
    const modelName = lessonData.models && lessonData.models.length > 0 ? lessonData.models[0].name : '';
    if (isExploreIframeReady) {
        try {
            exploreIframe.contentWindow.postMessage({
                type: 'loadModelByName',
                modelName: modelName,
                lessonData: lessonData // Pass the full lesson data
            }, '*');
            console.log('[DEBUG] Sent loadModelByName to explore iframe:', modelName);
        } catch (error) {
            console.error('[ERROR] Failed to send loadModelByName to explore iframe:', error);
        }
    } else {
        console.log('[DEBUG] Explore iframe not ready, message will be sent after load');
    }
}

        function sendLessonToPresent(lessonData) {
            const presentIframe = document.getElementById('tab2Iframe');
            if (presentIframe && presentIframe.contentWindow) {
                presentIframe.contentWindow.postMessage({
                    type: 'loadSlides',
                    lesson: lessonData
                }, '*');
            }
        }

        window.addEventListener('message', (event) => {
            const { type, lesson, lessons } = event.data;
            if (type === 'lessonSelected' && lesson) {
                gradeOneContent.currentLesson = lesson;
                sendLessonToExplore(lesson);
                sendLessonToPresent(lesson);
            } else if (type === 'lessonsLoaded' && lessons) {
                gradeOneContent.lessons = lessons;
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            switchTab('tab1');
            document.getElementById('tab1Iframe').contentWindow.postMessage({
                type: 'loadLessons'
            }, '*');
        });
    </script>
</body>
</html>
