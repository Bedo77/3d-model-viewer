<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics Educational 3D Models</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
        }
        .left-sidebar {
            width: 20%; /* Sidebar for grades */
            height: 100%; /* Full height */
            background-color: #2c7481; /* Paradiso */
            display: flex;
            flex-direction: column;
            padding: 10px;
            box-sizing: border-box;
        }
        .grade-button {
            width: 100%;
            height: 50px;
            margin: 10px 0;
            border-radius: 5px;
            background-color: #f47e42; /* Jaffa */
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .grade-button:hover {
            background-color: #f46c27; /* Flamingo */
        }
        .main-content {
            width: 60%; /* Main content area */
            height: 100%; /* Full height */
            display: flex;
            flex-direction: column;
        }
        .info-viewport {
            width: 100%; /* Full width of main-content */
            height: 50%; /* Half of main-content height */
            background-color: #1A0E0D; /* Darker brown */
            color: #FFFFFF; /* Regular white color */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
            box-sizing: border-box;
            overflow-y: auto;
        }
        .model-viewport {
            width: 100%; /* Full width of main-content */
            height: 50%; /* Half of main-content height */
            background-color: #f0f0f0; /* Light gray for better visibility */
            margin-bottom: 2.5mm; /* Small bottom margin */
            border-radius: 5px; 
            position: relative;
        }
        .right-sidebar {
            width: 20%; /* Sidebar for models */
            height: 100%; /* Full height */
            background-color: #2c7481; /* Paradiso */
            display: flex;
            flex-direction: column;
            padding: 10px;
            box-sizing: border-box;
            overflow-y: auto;
        }
        .model-icon {
            width: 80px;
            height: 80px;
            margin: 10px;
            border: 1px solid #fff;
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            background-color: #fff;
            transition: transform 0.3s ease;
        }
        .model-icon:hover {
            transform: scale(1.1);
        }
        .model-icon img {
            max-width: 100%;
            max-height: 100%;
            border-radius: 5px;
        }
        .top-bar {
            width: 100%;
            height: 50px;
            background-color: #2c7481; /* Paradiso */
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 0 20px;
            box-sizing: border-box;
        }
        .button {
            margin-left: 10px;
            padding: 10px 15px;
            color: white;
            background-color: #f47e42; /* Jaffa */
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .button:hover {
            background-color: #f46c27; /* Flamingo */
        }
    </style>
</head>
<body>
    <div class="left-sidebar">
        <div class="grade-button" id="btnGrade1">Grade 1</div>
        <div class="grade-button" id="btnGrade2">Grade 2</div>
        <div class="grade-button" id="btnGrade3">Grade 3</div>
    </div>
    <div class="main-content">
        <div class="info-viewport" id="infoViewport">
            <h2>Welcome to the Physics Section</h2>
            <p>Select a grade to explore relevant models.</p>
        </div>
        <div class="model-viewport" id="mainViewport"></div>
    </div>
    <div class="right-sidebar">
        <h3 style="color: white;">Model Tracks</h3>
        <div id="trackModels"></div>
    </div>
    <div class="top-bar">
        <button class="button" id="btnHome">Home</button>
        <button class="button" id="btnBack">Back</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script>
        let currentScene, currentRenderer, currentCamera, currentControls, modelGroup;

        function createScene() {
            const viewport = document.getElementById('mainViewport');
            currentScene = new THREE.Scene();
            currentCamera = new THREE.PerspectiveCamera(75, viewport.clientWidth / viewport.clientHeight, 0.1, 1000);
            currentRenderer = new THREE.WebGLRenderer({ antialias: true });

            currentRenderer.setSize(viewport.clientWidth, viewport.clientHeight);
            viewport.appendChild(currentRenderer.domElement);

            currentControls = new THREE.OrbitControls(currentCamera, currentRenderer.domElement);
            currentControls.enableDamping = true;
            currentControls.dampingFactor = 0.1;

            const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
            currentScene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
            directionalLight.position.set(5, 10, 7.5);
            currentScene.add(directionalLight);

            currentCamera.position.set(0, 2, 10);
            currentCamera.lookAt(0, 0, 0);

            createModelGroup();
            animate();
        }

        function createModelGroup() {
            modelGroup = new THREE.Group();
            currentScene.add(modelGroup);
        }

        function animate() {
            requestAnimationFrame(animate);
            if (currentScene) {
                modelGroup.rotation.y += 0.005;
            }
            currentRenderer.render(currentScene, currentCamera);
        }

        function loadModels(models) {
            clearModels();
            models.forEach(model => {
                const loader = new THREE.GLTFLoader();
                loader.load(model.path, function(object) {
                    modelGroup.add(object.scene);
                }, function(xhr) {
                    console.log(`${model.name}: ${(xhr.loaded / xhr.total) * 100}% loaded`);
                }, function(error) {
                    console.error(`Error loading model: ${model.path}`, error);
                });
            });
        }

        function clearModels() {
            while (modelGroup.children.length) {
                modelGroup.remove(modelGroup.children[0]);
            }
        }

        const gradeContent = {
            grade1: {
                title: "Grade 1: Simple Machines",
                description: "Exploration of how simple machines work and how they make work easier.",
                models: [
                    { path: 'https://raw.githubusercontent.com/Bedo77/3d-model-viewer/main/Physics/grade%20one%20arcade_machine.glb', name: 'Arcade Machine' },
                    { path: 'https://raw.githubusercontent.com/Bedo77/3d-model-viewer/main/Physics/grade%20one%20time_machine.glb', name: 'Time Machine' },
                ]
            },
            grade2: {
                title: "Grade 2: Forces and Motion",
                description: "Experimenting with different forces and observing their effects on motion.",
                models: [
                    { path: 'https://raw.githubusercontent.com/Bedo77/3d-model-viewer/main/Physics/grade%20two%20forces_on_a_rotating_man.glb', name: 'Forces on a Rotating Man' },
                    { path: 'https://raw.githubusercontent.com/Bedo77/3d-model-viewer/main/Physics/grade%20two%20machinery_-_single_pashe_dc_motor.glb', name: 'Single Phase DC Motor' },
                ]
            },
            grade3: {
                title: "Grade 3: Electromagnetism",
                description: "Exploring the principles of electromagnetism and its applications.",
                models: [
                    { path: 'https://raw.githubusercontent.com/Bedo77/3d-model-viewer/main/Physics/grade%20three%20electromagnetic_portal.glb', name: 'Electromagnetic Portal' },
                    { path: 'https://raw.githubusercontent.com/Bedo77/3d-model-viewer/main/Physics/grade%20three%20electromagneticwave.glb', name: 'Electromagnetic Wave' },
                ]
            }
        };

        document.getElementById('btnHome').addEventListener('click', () => {
            console.log("Home button clicked");
            // Implement home button functionality here
        });

        document.getElementById('btnBack').addEventListener('click', () => {
            console.log("Back button clicked");
            // Implement back button functionality here
        });

        function updateInfoViewport(title, description) {
            const infoViewport = document.getElementById('infoViewport');
            infoViewport.innerHTML = `
                <h2>${title}</h2>
                <p>${description}</p>
            `;
        }

        function displayModelIcons(models) {
            const trackModels = document.getElementById('trackModels');
            trackModels.innerHTML = ''; // Clear previous icons
            models.forEach(model => {
                const iconDiv = document.createElement('div');
                iconDiv.className = 'model-icon';
                iconDiv.setAttribute('draggable', 'true');
                iconDiv.dataset.model = model.name;
                iconDiv.innerHTML = `<img src="path/to/icon.png" alt="${model.name}" />`; // Replace with actual icon path

                iconDiv.addEventListener('dragstart', (e) => {
                    e.dataTransfer.setData('text/plain', model.path); // Drag model path
                });

                trackModels.appendChild(iconDiv);
            });
        }

        // Event listeners for grade buttons
        document.getElementById('btnGrade1').addEventListener('click', () => {
            updateInfoViewport(gradeContent.grade1.title, gradeContent.grade1.description);
            loadModels(gradeContent.grade1.models);
            displayModelIcons(gradeContent.grade1.models);
        });

        document.getElementById('btnGrade2').addEventListener('click', () => {
            updateInfoViewport(gradeContent.grade2.title, gradeContent.grade2.description);
            loadModels(gradeContent.grade2.models);
            displayModelIcons(gradeContent.grade2.models);
        });

        document.getElementById('btnGrade3').addEventListener('click', () => {
            updateInfoViewport(gradeContent.grade3.title, gradeContent.grade3.description);
            loadModels(gradeContent.grade3.models);
            displayModelIcons(gradeContent.grade3.models);
        });

        // Initialize default view (Grade 1)
        createScene();
        updateInfoViewport(gradeContent.grade1.title, gradeContent.grade1.description);
        loadModels(gradeContent.grade1.models);
        displayModelIcons(gradeContent.grade1.models);
    </script>
</body>
</html>
