<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Educational 3D Models - Smartistic-Lab</title>
    <style>
        /* Existing CSS unchanged, moved to styles.css later */
        body { margin: 0; font-family: 'Georgia', serif; overflow: hidden; background-color: #7edb61; position: relative; }
        .sidebar { width: 15%; height: 100vh; background-color: #f46c27; color: #1F1714; position: fixed; top: 0; left: 0; display: flex; flex-direction: column; align-items: center; padding-top: 20px; z-index: 10; transform: scale(0.9); border-radius: 10px; }
        .button { width: 70%; padding: 8px; margin: 5px 0; background-color: white; color: #1F1714; text-align: center; cursor: pointer; border-radius: 5px; transition: background-color 0.3s; font-size: 14px; }
        .button:hover { background-color: #f0f0f0; }
        .main-content { margin-left: 15%; width: 70%; height: 100vh; display: flex; flex-direction: column; position: relative; background-color: transparent; margin-top: 2px; margin-bottom: 2px; }
        .info-viewport { height: 45%; background-color: #1F1714; padding: 20px; overflow-y: auto; box-sizing: border-box; color: #ffffff; font-family: 'Georgia', serif; border-radius: 10px; }
        .model-viewport { height: 55%; position: relative; overflow: hidden; border-radius: 10px; }
        #arButton { position: absolute; bottom: 20px; right: 20px; padding: 10px; background-color: #f47e42; color: white; border: none; border-radius: 5px; cursor: pointer; z-index: 20; }
        #arMessage { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-size: 16px; z-index: 10; }
        canvas { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="sidebar" id="sidebar">
        <div class="button" id="btnPhysics">Physics</div>
        <div class="button" id="btnGeometry">Geometry</div>
    </div>
    <div class="main-content" id="mainContent">
        <div class="info-viewport" id="infoViewport">
            <h2>Welcome to Smartistic-Lab Studio</h2>
            <p>Welcome to <strong>Smartistic-Lab Studio</strong>, where education meets technology!</p>
        </div>
        <div class="model-viewport" id="mainViewport">
            <div id="arMessage">Loading...</div>
        </div>
    </div>
    <button id="arButton" style="display: none;">Start AR</button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script>
        let scene, renderer, camera, controls, modelGroup, reticle;
        let xrSession = null, xrHitTestSource = null, xrReferenceSpace = null;
        const clock = new THREE.Clock();

        // Initialize scene
        document.addEventListener('DOMContentLoaded', () => {
            const viewport = document.getElementById('mainViewport');
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(viewport.clientWidth, viewport.clientHeight);
            renderer.xr.enabled = true; // Enable WebXR
            viewport.appendChild(renderer.domElement);

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, viewport.clientWidth / viewport.clientHeight, 0.1, 1000);
            camera.position.set(0, 5, 10);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.1;

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            modelGroup = new THREE.Group();
            scene.add(modelGroup);

            // Reticle for AR placement
            reticle = new THREE.Mesh(
                new THREE.RingGeometry(0.15, 0.2, 32).rotateX(-Math.PI / 2),
                new THREE.MeshBasicMaterial({ color: 0xffffff })
            );
            reticle.visible = false;
            scene.add(reticle);

            loadDefaultModels();
            animate();

            // Check WebXR support and show AR button
            if ('xr' in navigator) {
                navigator.xr.isSessionSupported('immersive-ar').then(supported => {
                    if (supported) {
                        document.getElementById('arButton').style.display = 'block';
                        document.getElementById('arButton').addEventListener('click', startARSession);
                    } else {
                        document.getElementById('arMessage').textContent = 'AR not supported on this device.';
                    }
                });
            } else {
                document.getElementById('arMessage').textContent = 'WebXR not available in this browser.';
            }
        });

        function loadDefaultModels() {
            const loader = new THREE.GLTFLoader();
            loader.load('https://raw.githubusercontent.com/Bedo77/3d-model-viewer/main/models/animals_pack.glb', (gltf) => {
                const model = gltf.scene;
                model.scale.set(0.5, 0.5, 0.5);
                model.position.set(0, 0, 0);
                modelGroup.add(model);
                document.getElementById('arMessage').style.display = 'none';
            }, undefined, (error) => {
                console.error('Model load error:', error);
                document.getElementById('arMessage').textContent = 'Failed to load model.';
            });
        }

        function startARSession() {
            navigator.xr.requestSession('immersive-ar', {
                requiredFeatures: ['hit-test', 'local-floor']
            }).then(session => {
                xrSession = session;
                session.addEventListener('end', () => {
                    xrSession = null;
                    xrHitTestSource = null;
                    reticle.visible = false;
                    renderer.xr.setSession(null);
                    document.getElementById('arButton').style.display = 'block';
                });

                renderer.xr.setSession(session);
                session.requestReferenceSpace('local-floor').then(refSpace => {
                    xrReferenceSpace = refSpace;
                });

                session.requestHitTestSource({ space: xrReferenceSpace }).then(hitTestSource => {
                    xrHitTestSource = hitTestSource;
                });

                document.getElementById('arButton').style.display = 'none';
            }).catch(err => {
                console.error('AR session failed:', err);
                document.getElementById('arMessage').textContent = 'Failed to start AR: ' + err.message;
            });
        }

        function animate() {
            renderer.setAnimationLoop((timestamp, frame) => {
                if (!frame) return;

                if (xrSession && xrHitTestSource) {
                    const hitTestResults = frame.getHitTestResults(xrHitTestSource);
                    if (hitTestResults.length > 0) {
                        const hitPose = hitTestResults[0].getPose(xrReferenceSpace);
                        reticle.visible = true;
                        reticle.matrix.fromArray(hitPose.transform.matrix);
                    } else {
                        reticle.visible = false;
                    }
                }

                if (!xrSession) {
                    controls.update();
                    modelGroup.rotation.y += 0.005; // Rotate in non-AR mode
                }

                renderer.render(scene, camera);
            });
        }

        // Place model on tap
        document.addEventListener('click', (event) => {
            if (xrSession && reticle.visible) {
                const modelClone = modelGroup.children[0].clone();
                modelClone.position.setFromMatrixPosition(reticle.matrix);
                scene.add(modelClone);
            }
        });

        window.addEventListener('resize', () => {
            const viewport = document.getElementById('mainViewport');
            camera.aspect = viewport.clientWidth / viewport.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(viewport.clientWidth, viewport.clientHeight);
        });
    </script>
</body>
</html>
